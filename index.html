<script>'use strict';
/* ===== Hilfsfunktionen ===== */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmt(n){n=Math.round(n*1e6)/1e6;let [i,d]=String(Math.abs(n)).split('.');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (n<0?'−':'')+i+(d?','+d:'')}
const eur=c=>(c/100).toFixed(2).replace('.',',')+' €';
const Q=(q,a,o={})=>Object.assign({q,a,kind:typeof a==='number'?'num':'text'},o);
const X=(q,a,hint,opts,steps)=>Q(q,a,{hint,opts,steps,kind:opts?'choice':typeof a==='number'?'num':'text'});
const PL=['Einer','Zehner','Hunderter','Tausender','Zehntausender','Hunderttausender','Millionen'];
const G={};

/* ===== Antwort prüfen ===== */
function checkAns(q,input){
  input=String(input==null?'':input).trim(); if(!input) return null;
  const acc=[].concat(q.a).map(String);
  if(q.kind==='choice') return acc.includes(input);
  if(q.kind==='num'){
    let s=input.replace(/\s+/g,'').replace(/[−–]/g,'-');
    s=s.replace(/(\d)[.](?=\d{3}(?!\d))/g,'$1');
    s=s.replace(',','.');
    const v=Number(s); if(!isFinite(v)||s==='') return false;
    return acc.some(x=>Math.abs(Number(x)-v)<1e-9);
  }
  let n=input.toLowerCase();
  if(q.pre) n=q.pre(n);
  n=n.replace(/[„“”"'’`´.!?]/g,'');
  n=q.ks?n.replace(/\s+/g,' ').trim():n.replace(/\s+/g,'');
  if(q.loose) n=n.replace(/-/g,'');
  if(q.rest) n=n.replace(/rest/g,'r');
  return acc.some(x=>{let y=String(x).toLowerCase().replace(/[„“”"'’`´.!?]/g,'');y=q.ks?y.replace(/\s+/g,' ').trim():y.replace(/\s+/g,'');if(q.loose)y=y.replace(/-/g,'');if(q.rest)y=y.replace(/rest/g,'r');return y===n});
}

/* ===== Schriftliche Rechenwege ===== */
function lay(a,b,op,res,carry){
  const w=Math.max(String(a).length,String(b).length,String(res).length)+2, p=s=>String(s).padStart(w,' ');
  return `<pre class="col">${p(a)}\n${op} ${String(b).padStart(w-2,' ')}\n${'─'.repeat(w)}\n${carry?carry.join('')+'  ← Übertrag\n':''}${p(res)}</pre>`;
}
function stepsAdd(a,b){
  const A=String(a),B=String(b),n=Math.max(A.length,B.length);
  const da=A.padStart(n,'0').split('').map(Number),db=B.padStart(n,'0').split('').map(Number);
  let c=0,tx=[];const w=String(a+b).length+2,car=Array(w).fill(' ');
  for(let i=n-1;i>=0;i--){const pos=n-1-i,s=da[i]+db[i]+c,d=s%10,nc=Math.floor(s/10);
    tx.push(`<b>${PL[pos]||'Stelle '+(pos+1)}:</b> ${da[i]} + ${db[i]}${c?' + '+c+' (Übertrag)':''} = ${s} → schreibe ${d}${nc?', merke '+nc:''}`);
    if(nc) car[w-1-(pos+1)]=nc; c=nc;}
  if(c) tx.push(`Ganz vorne: schreibe den Übertrag ${c}.`);
  return lay(a,b,'+',a+b,car)+'<ol><li>'+tx.join('</li><li>')+'</li></ol>Ergebnis: <b>'+fmt(a+b)+'</b>';
}
function stepsSub(a,b){
  if(b>a) return `Hier ist die zweite Zahl größer – das Ergebnis ist negativ: ${fmt(a-b)}. (In Klasse 5 rechnest du meist mit a ≥ b.)`;
  const A=String(a),n=A.length,da=A.split('').map(Number),db=String(b).padStart(n,'0').split('').map(Number);
  let br=0,tx=[],res=Array(n),w=n+2,car=Array(w).fill(' ');

  if(t===1){const c=R(105,995);return Q(`<b>${c} ct</b> = ? €`,c/100,{hint:'Schreibe z. B. 7,25',steps:`100 ct = 1 €. ${c} : 100 = ${(c/100).toFixed(2).replace('.',',')}`})}
  const a=R(120,950),b=R(60,480);
  return t===2?Q(`Rechne: <b>${eur(a)} + ${eur(b)}</b> (in €)`,(a+b)/100,{steps:`Komma unter Komma! ${a} ct + ${b} ct = ${a+b} ct = ${eur(a+b)}`}):Q(`Du hast ${eur(a+b)} und kaufst etwas für ${eur(b)}. Wie viel Rückgeld? (in €)`,a/100,{steps:`${eur(a+b)} − ${eur(b)} = ${eur(a)}`})};
function umr(units,vals){return()=>{const [f,t,fac]=pick(units),big=R(0,1);
  if(big){const v=R(1,50);return Q(`<b>${v} ${f}</b> = ? ${t}`,v*fac,{steps:`1 ${f} = ${fac} ${t}. Also ${v} · ${fac} = ${v*fac}.`})}
  const v=R(1,99)/10;const x=Math.round(v*fac*1e6)/1e6;return Q(`<b>${fmt(x)} ${t}</b> = ? ${f}`,v,{hint:'Du darfst ein Komma verwenden.',steps:`${fac} ${t} = 1 ${f}. Also ${fmt(x)} : ${fac} = ${fmt(v)}.`})}}
G.laenge=umr([['cm','mm',10],['dm','cm',10],['m','dm',10],['m','cm',100],['km','m',1000],['m','mm',1000]]);
G.gewicht=umr([['kg','g',1000],['t','kg',1000]]);
G.zeit=()=>{const t=R(0,3);
  if(t===0){const h=R(1,9);return Q(`<b>${h} h</b> = ? min`,h*60,{steps:`1 h = 60 min. ${h} · 60 = ${h*60}`})}
  if(t===1){const h=R(1,9);return Q(`<b>${h*60} min</b> = ? h`,h,{steps:`60 min = 1 h. ${h*60} : 60 = ${h}`})}
  if(t===2){const h=R(1,5),m=R(1,11)*5;return Q(`<b>${h} h ${m} min</b> = ? min`,h*60+m,{steps:`${h} · 60 = ${h*60}; dazu ${m} → ${h*60+m}`})}
  const m=R(1,9);return Q(`<b>${m} min</b> = ? s`,m*60,{steps:`1 min = 60 s. ${m} · 60 = ${m*60}`})};
G.massstab=()=>{const N=pick([10,50,100,200,500,1000]),d=R(2,12),real=d*N;const m=real>=100;
  return Q(`Maßstab <b>1 : ${N}</b>. Auf der Zeichnung sind es <b>${d} cm</b>. Wie lang ist es in Wirklichkeit (in ${m?'m':'cm'})?`,m?real/100:real,{steps:`In Wirklichkeit ist alles ${N}-mal so groß: ${d} · ${N} = ${real} cm${m?' = '+fmt(real/100)+' m':''}.`})};
G.rechteck=()=>{const a=R(3,15),b=R(2,12),sq=R(0,3)===0;
  if(sq)return R(0,1)?Q(`Quadrat mit Seite a = ${a} cm. Wie groß ist der <b>Flächeninhalt</b>? (in cm²)`,a*a,{steps:`A = a · a = ${a} · ${a} = ${a*a} cm²`}):Q(`Quadrat mit Seite a = ${a} cm. Wie groß ist der <b>Umfang</b>? (in cm)`,4*a,{steps:`U = 4 · a = 4 · ${a} = ${4*a} cm`});
  return R(0,1)?Q(`Rechteck: a = ${a} cm, b = ${b} cm. <b>Flächeninhalt</b>? (in cm²)`,a*b,{steps:`A = a · b = ${a} · ${b} = ${a*b} cm²`}):Q(`Rechteck: a = ${a} cm, b = ${b} cm. <b>Umfang</b>? (in cm)`,2*(a+b),{steps:`U = 2 · (a + b) = 2 · (${a} + ${b}) = 2 · ${a+b} = ${2*(a+b)} cm`})};
G.flaecheneinheit=()=>{const [f,t,fac]=pick([['cm²','mm²',100],['dm²','cm²',100],['m²','dm²',100],['a','m²',100],['ha','a',100],['ha','m²',10000],['km²','ha',100]]);const v=R(1,30);
  return Q(`<b>${v} ${f}</b> = ? ${t}`,v*fac,{hint:'a = 100 m², ha = 100 a = 10 000 m²',steps:`Bei Flächen springt man mit 100 (a→m², ha→a). ${v} · ${fac} = ${fmt(v*fac)}.`})};
G.parallelogramm=()=>{const g=R(2,12)*2,h=R(2,9);return R(0,1)?Q(`Parallelogramm mit Grundseite g = ${g} cm und Höhe h = ${h} cm. <b>Flächeninhalt</b> in cm²?`,g*h,{steps:`A = g · h = ${g} · ${h} = ${g*h} cm²`}):Q(`Dreieck mit Grundseite g = ${g} cm und Höhe h = ${h} cm. <b>Flächeninhalt</b> in cm²?`,g*h/2,{steps:`Das Dreieck ist ein halbes Parallelogramm: A = g · h : 2 = ${g} · ${h} : 2 = ${g*h/2} cm²`})};
G.bruchteil=()=>{const n=pick([4,5,6,8,10,12]),k=R(1,n-1);return Q(`Eine Pizza ist in <b>${n}</b> gleich große Stücke geschnitten. <b>${k}</b> Stück${k>1?'e':''} wurden gegessen. Welcher Bruchteil wurde gegessen? <small>(schreibe z. B. 3/8)</small>`,`${k}/${n}`,{steps:`Zähler = gegessene Stücke (${k}), Nenner = alle Stücke (${n}). Bruch: ${k}/${n}`})};
G.bruchadd=()=>{const n=pick([4,5,6,8,10,12]),a=R(1,n-2),b=R(1,n-1-a),add=R(0,1);
  return add?Q(`Rechne: <b>${a}/${n} + ${b}/${n}</b> <small>(Ergebnis als Bruch, z. B. 5/8)</small>`,`${a+b}/${n}`,{steps:`Gleiche Nenner: Zähler addieren, Nenner bleibt. ${a} + ${b} = ${a+b} → ${a+b}/${n}`}):Q(`Rechne: <b>${a+b}/${n} − ${a}/${n}</b> <small>(Ergebnis als Bruch)</small>`,`${b}/${n}`,{steps:`Zähler subtrahieren: ${a+b} − ${a} = ${b} → ${b}/${n}`})};
G.anteil=()=>{const k=pick([2,3,4,5,10]),z=R(1,k-1),u=R(2,12)*k,unit=pick(['€','cm','kg','Schüler']);
  return Q(`Berechne: <b>${z}/${k} von ${u} ${unit}</b>`,u/k*z,{steps:`Erst teilen: ${u} : ${k} = ${u/k}. Dann mal ${z}: ${u/k} · ${z} = ${u/k*z}.`})};
G.gemischt=()=>{if(R(0,1)){const d=pick([3,4,5,6,8]),g=R(1,4),r=R(1,d-1),n=g*d+r;return Q(`Schreibe <b>${n}/${d}</b> als gemischte Zahl. <small>(z. B. 1 3/4)</small>`,`${g} ${r}/${d}`,{ks:true,steps:`${n} : ${d} = ${g} Rest ${r} → ${g} ${r}/${d}`})}
  const d=pick([3,4,5,6,8]),g=R(1,4),r=R(1,d-1);return Q(`Schreibe <b>${g} ${r}/${d}</b> als Bruch. <small>(z. B. 7/4)</small>`,`${g*d+r}/${d}`,{steps:`${g} · ${d} + ${r} = ${g*d+r} → ${g*d+r}/${d}`})};
G.diagramm=()=>{const all=['Hund','Katze','Pferd','Hase','Fisch'],labels=all.slice(0,4),vals=labels.map(()=>R(2,12)),t=R(0,2);let max=Math.max(...vals);
  const svg=`<div class="svgbox">${barSvg(labels,vals)}</div>`,i=R(0,3);
  if(t===0)return Q(svg+`Wie viele Kinder mögen <b>${labels[i]}</b>?`,vals[i],{steps:`Lies die Höhe des Balkens ab: ${vals[i]}.`});
  if(t===1)return Q(svg+`Wie viele Kinder wurden <b>insgesamt</b> gefragt?`,vals.reduce((a,b)=>a+b),{steps:`Addiere alle Balken: ${vals.join(' + ')} = ${vals.reduce((a,b)=>a+b)}`});
  const best=labels[vals.indexOf(max)];if(vals.filter(v=>v===max).length>1)return G.diagramm();
  return Q(svg+'Welches Tier ist am beliebtesten?',best,{kind:'choice',opts:labels,steps:`Der höchste Balken (${max}) gehört zu ${best}.`})};
G.datenliste=()=>{const n=R(5,8),v=Array.from({length:n},()=>R(3,40)),mx=Math.max(...v),mn=Math.min(...v),t=R(0,2);
  const l=`Messwerte: <b>${v.join(', ')}</b><br>`;
  return t===0?Q(l+'Wie groß ist der <b>größte</b> Wert?',mx,{steps:`Der größte Wert ist ${mx}.`}):t===1?Q(l+'Wie groß ist der <b>kleinste</b> Wert?',mn,{steps:`Der kleinste Wert ist ${mn}.`}):Q(l+'Wie groß ist der Unterschied zwischen größtem und kleinstem Wert (<b>Spannweite</b>)?',mx-mn,{steps:`${mx} − ${mn} = ${mx-mn}`})};
G.koordinaten=()=>{const x=R(1,8),y=R(1,8);return Q(`<div class="svgbox">${gridSvg([[x,y,'P']])}</div>Welche Koordinaten hat der Punkt <b>P</b>? <small>(schreibe z. B. 3|5)</small>`,`${x}|${y}`,{pre:s=>s.replace(/[()\s]/g,'').replace(/[,;/]/g,'|'),steps:`Erst nach rechts (x = ${x}), dann nach oben (y = ${y}): P(${x}|${y}). Merke: „Erst laufen, dann hochspringen!“`})};
G.verschieb=()=>{const x=R(0,5),y=R(0,5),r=R(1,3),u=R(1,3),dir=R(0,1);
  return Q(`Der Punkt A(${x}|${y}) wird um <b>${r}</b> nach rechts und um <b>${u}</b> nach ${dir?'oben':'oben'} verschoben. Wie lauten die neuen Koordinaten? <small>(z. B. 4|5)</small>`,`${x+r}|${y+u}`,{pre:s=>s.replace(/[()\s]/g,'').replace(/[,;/]/g,'|'),steps:`x: ${x} + ${r} = ${x+r}; y: ${y} + ${u} = ${y+u} → A'(${x+r}|${y+u})`})};

G.trick5=()=>{const a=R(12,98);return Q(`5-Trick: <b>${a} · 5</b>`,a*5,{hint:'Mal 10 und halbieren',steps:`${a} · 10 = ${a*10}, halbiert: ${a*5}`})};
G.trick9=()=>{const a=R(12,98);return Q(`9-Trick: <b>${a} · 9</b>`,a*9,{hint:'Mal 10 minus die Zahl',steps:`${a} · 10 = ${a*10}, minus ${a} = ${a*9}`})};
G.trick25=()=>{const a=R(2,24)*4;return Q(`25-Trick: <b>${a} · 25</b>`,a*25,{hint:'Durch 4 und mal 100',steps:`${a} : 4 = ${a/4}, mal 100 = ${a*25}`})};
G.trick4=()=>{const a=R(12,99);return Q(`4-Trick: <b>${a} · 4</b>`,a*4,{hint:'Zweimal verdoppeln',steps:`${a}·2 = ${a*2}, ·2 = ${a*4}`})};
G.plus99=()=>{const a=R(120,900),add=R(0,1),k=pick([9,99,19,29]);return Q(`Rechne im Kopf: <b>${a} ${add?'+':'−'} ${k}</b>`,add?a+k:a-k,{steps:`${add?'+':'−'} ${k+1} und dann ${add?'1 zurück':'1 wieder dazu'}: ${add?a+k+1:a-k-1} ${add?'−':'+'} 1 = ${add?a+k:a-k}`})};
G.teilbar=()=>{const t=pick([2,3,5,9,10]),n=R(100,9999),d=n.toString().split('').map(Number),qs=d.reduce((a,b)=>a+b),ok=n%t===0;
  const rule={2:'Die letzte Ziffer ist gerade (0,2,4,6,8).',3:`Die Quersumme (${qs}) ist durch 3 teilbar.`,5:'Die letzte Ziffer ist 0 oder 5.',9:`Die Quersumme (${qs}) ist durch 9 teilbar.`,10:'Die letzte Ziffer ist 0.'}[t];
  return Q(`Ist <b>${fmt(n)}</b> durch <b>${t}</b> teilbar?`,ok?'Ja':'Nein',{kind:'choice',opts:['Ja','Nein'],steps:`Regel für ${t}: ${rule} → ${ok?'Ja':'Nein'}.`})};
G.quadrat5=()=>{const a=R(1,9),n=a*10+5;return Q(`Quadrat-Trick: <b>${n} · ${n}</b>`,n*n,{hint:`${a} · ${a+1} und dann 25 anhängen`,steps:`${a} · ${a+1} = ${a*(a+1)}, dann 25 anhängen → ${n*n}`})};

function langQ(code,words,mode,onlyChoice){

plane ✈️|boat ⛵|submarine 🚢|ship 🚢|helicopter 🚁|underground 🚇|motorbike 🏍️|skateboard 🛹|beach 🏖️|sea 🌊|wave 🌊|storm ⛈️|shark 🦈|sheep 🐑|pig 🐷|chicken 🐔|pizza 🍕|potato 🥔|popcorn 🍿|sunny ☀️|rainy 🌧️|windy 💨|cloudy ☁️|foggy 🌫️|cold 🥶|hot 🥵|coat 🧥|trousers 👖|jeans 👖|sock 🧦|skirt 👗|cap 🧢|shorts 🩳|helmet ⛑️|torch 🔦|wheelchair ♿|map 🗺️|postcard 💌|diary 📔|face 🙂|foot 🦶|feet 🦶|mud 🟤|moon 🌙|wool 🧶|rope 🪢|attic 🏚️|flat 🏢|post office 📮|swimming pool 🏊|shopping centre 🛍️|river 🏞️';
let _EMM=null;
function vemoji(en){
  if(!_EMM){_EMM={};_EM.split('|').forEach(x=>{const i=x.lastIndexOf(' ');const k=x.slice(0,i).toLowerCase();if(!_EMM[k])_EMM[k]=x.slice(i+1)})}
  let k=String(en||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/[…?!.]/g,'').replace(/^(to|a|an|the|go|play|have|watch|listen to)\s+/,'').replace(/\s+/g,' ').trim();
  if(_EMM[k])return _EMM[k];
  const k2=k.replace(/^(a|an|the|go|play|have|to)\s+/,'');if(_EMM[k2])return _EMM[k2];
  const sg=k.split(' / ')[0].split(' (')[0];if(_EMM[sg])return _EMM[sg];
  return '';
}
function vemh(en){const e=vemoji(en);return e?`<div class="vemo">${e}</div>`:''}
function vkey(en){return String(en).toLowerCase().replace(/\s+/g,' ').trim()}
function vocGet(){try{return JSON.parse(localStorage.getItem('sh5voc')||'[]')}catch(e){return[]}}
function vocSet(a){try{localStorage.setItem('sh5voc',JSON.stringify(a))}catch(e){}}
function vocDelGet(){try{return JSON.parse(localStorage.getItem('sh5vocdel')||'[]')}catch(e){return[]}}
function vocDelSet(a){try{localStorage.setItem('sh5vocdel',JSON.stringify(a))}catch(e){}}
function vff(w){return w.f||'englisch'}
function vfk(f,en){return(f&&f!=='englisch'?f+'|':'')+vkey(en)}
function vocNew(en,de,src,f){return{f:f||'englisch',id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),en:String(en).trim(),de:String(de).trim(),src:src||'Eigene Wörter',box:0,ok:0,no:0}}
/* Holt alle Vokabeln aus "Meine Sachen" dazu – sie bleiben hier gespeichert, auch wenn Fotos oder Sachen gelöscht werden. */
function vocSync(){
  const a=vocGet(),seen=new Set(a.map(w=>vfk(vff(w),w.en))),del=new Set(vocDelGet());let ch=false;
  MINE.forEach(it=>{const f=(SUBJ[it.s]||{}).id||'englisch';if(it.s===0)return;(it.vocab||[]).forEach(p=>{if(!p||!p[0]||!p[1])return;const k=vfk(f,p[0]);if(seen.has(k)||del.has(k)||del.has(vkey(p[0]))&&f==='englisch')return;seen.add(k);a.push(vocNew(p[0],p[1],it.name,f));ch=true})});
  if(ch)vocSet(a);return a}
function vst(){return window._vs||(window._vs={src:'all',only:false,f:'englisch'})}
function vfAll(){return vocSync().filter(w=>vff(w)===(vst().f||'englisch'))}
function vfs(){const f=vst().f||'englisch';return SUBJ.find(x=>x.id===f)||SUBJ[1]}
function vocPool(){const vs=vst();let a=vfAll();if(vs.src!=='all')a=a.filter(w=>w.src===vs.src);if(vs.only)a=a.filter(w=>(w.box||0)<3);return a}
function vocMark(id,good){const a=vocGet(),w=a.find(x=>x.id===id);if(!w)return;if(good){w.box=Math.min(5,(w.box||0)+1);w.ok=(w.ok||0)+1}else{w.box=0;w.no=(w.no||0)+1}vocSet(a)}
function vsize(def){const k=vst().n;return k==='all'?9999:(+k||def)}
function vocQueue(def){const n=vsize(def);return shuffle(shuffle(vocPool()).sort((a,b)=>(a.box||0)-(b.box||0)).slice(0,n))}
function vnorm(s){return String(s).toLowerCase().replace(/[’`´]/g,"'").replace(/[.!?…,;]+$/g,'').replace(/\s+/g,' ').trim()}
function vcands(en){const b=en.replace(/\s*\([^)]*\)/g,'').trim();return[...new Set([vnorm(en),vnorm(b),vnorm(b.replace(/^to\s+/i,'')),vnorm(en.replace(/[()]/g,''))])]}
function vpattern(en,r){let n=0;return en.split('').map(c=>{if(c===' ')return'  ';if(!/[A-Za-zÄÖÜäöüß0-9]/.test(c))return c;n++;return n<=r?c:'_'}).join(' ')}
function vsay(t){const f=vst().f||'englisch',s=SUBJ.find(x=>x.id===f);speak(t,f==='englisch'?'en-GB':(s&&s.lang)||'de-DE')}
function vend(good,again,total,mode){
  app().innerHTML=`<h1>🎉 Geschafft!</h1><div class="qcard"><div class="q">${good} von ${total} gewusst</div><p class="lead">${again?again+' Wörter üben wir bald noch einmal.':'Alles gewusst – stark!'}</p></div><a class="go" style="text-align:center" href="#/vocab/${mode}" onclick="setTimeout(route,0)">Nochmal</a><a class="go" style="text-align:center;background:var(--card);color:var(--tx);border:2px solid var(--bd)" href="#/vocab">Zurück zum Vokabel-Trainer</a>`}

function vocHome(){

  ${all.length?`<label class="hint">Üben mit:</label><select id="vsrc" class="ans"><option value="all">Alle Wörter (${all.length})</option>${srcs.map(s=>`<option value="${esc(s)}"${vs.src===s?' selected':''}>${esc(s)} (${all.filter(w=>w.src===s).length})</option>`).join('')}</select>
  <label class="chip" style="display:inline-flex;gap:8px;margin:4px 0 10px"><input type="checkbox" id="vonly"${vs.only?' checked':''}> nur Wörter, die ich noch nicht sicher kann</label>
  <div class="hint">${pool.length} Wörter in dieser Auswahl</div>
  <label class="hint">Wörter pro Runde:</label><select id="vn" class="ans">${[10,20,30,50].map(n=>`<option value="${n}"${String(vs.n||20)===String(n)?' selected':''}>${n}</option>`).join('')}<option value="all"${vs.n==='all'?' selected':''}>Alle ${pool.length}</option></select>
  <div class="hint">Zuerst kommen immer die Wörter, die du noch nicht kannst. Mach einfach mehrere Runden – so kommst du durch alle ${all.length} Wörter.</div>
  <div class="acts">${btn('cards','🃏','Karteikarten','umdrehen · gewusst?',1)}${btn('write','✍️','Schreiben','hören · tippen · Tipp',1)}${btn('listen','👂','Hören &amp; Antippen','richtiges Wort wählen',2)}${btn('match','🔗','Verbinden','6 Wörter zuordnen',3)}</div>`:`<p class="lead">Noch keine Vokabeln. Fotografiere eine Englisch-Seite, füge ein Paket von Claude ein oder trage unten Wörter selbst ein.</p>`}
  <a class="go" style="text-align:center;background:#7c3aed;margin-top:14px" href="#/vocab/list">📚 Meine Vokabeln (alle ansehen &amp; verwalten)</a>`;
  document.querySelectorAll('.vfb').forEach(b=>b.onclick=()=>{vst().f=b.dataset.f;vst().src='all';vocHome()});const s=$('#vsrc');if(s)s.onchange=()=>{vst().src=s.value;vocHome()};const n=$('#vn');if(n)n.onchange=()=>{vst().n=n.value;vocHome()};const o=$('#vonly');if(o)o.onchange=()=>{vst().only=o.checked;vocHome()}}

/* 🃏 Karteikarten */
function vocCards(){
  const q=vocQueue(20);if(!q.length)return go('#/vocab');
  let i=0,good=0,flipped=false;const again=new Set(),first=q.length;
  const show=()=>{
    if(i>=q.length)return vend(first-again.size,again.size,first,'cards');
    const w=q[i];flipped=false;
    app().innerHTML=`<a class="back" href="#/vocab">← Ende</a><div class="vprog">${i+1} / ${q.length}</div><div class="vcard" id="vc"><small>${vfs().icon} ${vfs().name} · tippe zum Umdrehen</small>${vemh(w.en)}<b>${esc(w.en)}</b><button class="vsp" id="vsp">🔊 Anhören</button></div><div id="vbt"></div>`;
    $('#vsp').onclick=e=>{e.stopPropagation();vsay(w.en)};$('#vc').onclick=flip;vsay(w.en)};
  const flip=()=>{
    if(flipped)return;flipped=true;const w=q[i],c=$('#vc');c.classList.add('flip');
    setTimeout(()=>{c.classList.add('de');c.innerHTML=`<small>${vfs().id==='englisch'?'🇩🇪 Deutsch':'💡 Bedeutung'}</small>${vemh(w.en)}<b>${esc(w.de)}</b><button class="vsp" id="vsp2">🔊 ${esc(w.en)}</button>`;$('#vsp2').onclick=e=>{e.stopPropagation();vsay(w.en)}},180);
    $('#vbt').innerHTML=`<div class="row2"><button id="vno" class="vno">❌ Wusste ich nicht</button><button id="vok" class="vok">✅ Wusste ich</button></div>`;
    $('#vok').onclick=()=>{vocMark(w.id,true);good++;i++;show()};
    $('#vno').onclick=()=>{vocMark(w.id,false);if(!again.has(w.id)){again.add(w.id);q.push(w)}i++;show()}};
  show()}

/* ✍️ Schreiben: hören, deutscher Tipp, Buchstaben nach Bedarf zeigen */
function vocWrite(){
  const q=vocQueue(15);if(!q.length)return go('#/vocab');
  let i=0;const again=new Set(),first=q.length;
  const show=()=>{
    if(i>=q.length)return vend(first-again.size,again.size,first,'write');
    const w=q[i];let r=0,done=false,used=false;const base=w.en.replace(/\s*\([^)]*\)/g,'').trim(),cs=vcands(w.en);
    app().innerHTML=`<a class="back" href="#/vocab">← Ende</a><div class="vprog">${i+1} / ${q.length}</div><div class="qcard"><small>✍️ Schreiben</small><div class="q">${vfs().id==='englisch'?'Höre das Wort und schreibe es auf Englisch auf.':'Höre den Begriff und schreibe ihn richtig auf.'}</div><button class="vsp" id="vh">🔊 Anhören</button><div class="vtip">💡 Tipp: <b>${esc(w.de)}</b></div><div class="vpat" id="vp">${esc(vpattern(base,0))}</div><input id="vi" class="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Englisches Wort"><div class="row2"><button id="vt">➕ Buchstabe zeigen</button><button id="vc" class="go" style="margin:0">Prüfen</button></div><div id="vfb"></div></div>`;
    const inp=$('#vi');$('#vh').onclick=()=>vsay(w.en);vsay(w.en);
    $('#vt').onclick=()=>{if(done)return;used=true;r=Math.min(base.replace(/[^A-Za-zÄÖÜäöüß0-9]/g,'').length,r+1);$('#vp').textContent=vpattern(base,r)};
    const check=()=>{
      if(done){i++;show();return}
      const a=vnorm(inp.value);if(!a)return;done=true;const ok=cs.includes(a);
      if(ok){if(!used)vocMark(w.id,true);$('#vfb').innerHTML=`<div class="fb ok"><b>${pick(PRAISE)}</b>${used?' (mit Tipp)':''}</div>`;inp.classList.add('good')}
      else{vocMark(w.id,false);if(!again.has(w.id)){again.add(w.id);q.push(w)}$('#vfb').innerHTML=`<div class="fb no"><b>Nicht ganz.</b> Richtig ist: <b>${esc(w.en)}</b></div>`;inp.classList.add('bad')}
      $('#vc').textContent='Weiter ▶'};
    $('#vc').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};try{inp.focus()}catch(e){}};
  show()}

/* 👂 Hören & Antippen */
function vocListen(){
  const q=vocQueue(15),all=vfAll();if(!q.length||all.length<2)return go('#/vocab');
  let i=0;const again=new Set(),first=q.length;
  const show=()=>{
    if(i>=q.length)return vend(first-again.size,again.size,first,'listen');

/* 🔗 Verbinden: 6 englische und 6 deutsche Wörter */
function vocMatch(){
  let pool=shuffle(vocPool().sort(()=>0)).sort((a,b)=>(a.box||0)-(b.box||0)).slice(0,vsize(24));if(pool.length<3)return go('#/vocab');
  const seenDe=new Set(),uniq=[];pool.forEach(w=>{const k=vkey(w.de);if(!seenDe.has(k)){seenDe.add(k);uniq.push(w)}});pool=uniq;if(pool.length<3)return go('#/vocab');
  const rounds=[];for(let k=0;k<pool.length;k+=6)rounds.push(pool.slice(k,k+6));
  if(rounds.length>1&&rounds[rounds.length-1].length<3){const l=rounds.pop();rounds[rounds.length-1]=rounds[rounds.length-1].concat(l)}
  let ri=0,good=0,total=0,badWords=0;
  const show=()=>{
    if(ri>=rounds.length)return vend(good,badWords,total,'match');
    const r=rounds[ri],miss={};let left=r.length,sel=null;
    app().innerHTML=`<a class="back" href="#/vocab">← Ende</a><div class="vprog">Runde ${ri+1} / ${rounds.length}</div><p class="lead">Tippe ein englisches Wort und dann das passende deutsche.</p><div class="vmatch"><div>${shuffle(r.slice()).map(w=>`<button class="vm" data-s="en" data-id="${w.id}">${esc(w.en)}</button>`).join('')}</div><div>${shuffle(r.slice()).map(w=>`<button class="vm" data-s="de" data-id="${w.id}">${esc(w.de)}</button>`).join('')}</div></div><div id="vfb"></div>`;
    const bs=[...document.querySelectorAll('.vm')];
    bs.forEach(b=>b.onclick=()=>{
      if(b.classList.contains('done'))return;
      if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');if(b.dataset.s==='en'){const w=r.find(x=>x.id===b.dataset.id);vsay(w.en)}return}
      const en=sel.dataset.s==='en'?sel:b,de=sel.dataset.s==='en'?b:sel;sel.classList.remove('sel');const s0=sel;sel=null;
      if(en.dataset.id===de.dataset.id){en.classList.add('done');de.classList.add('done');left--;
        if(left===0){r.forEach(w=>{total++;if(miss[w.id]){badWords++;vocMark(w.id,false)}else{good++;vocMark(w.id,true)}});
          $('#vfb').innerHTML=`<div class="fb ok"><b>${pick(PRAISE)}</b> Alle ${r.length} richtig verbunden.</div><button id="vn" class="go">Weiter ▶</button>`;$('#vn').onclick=()=>{ri++;show()}}}
      else{miss[en.dataset.id]=1;[en,de].forEach(x=>{x.classList.add('wrong');setTimeout(()=>x.classList.remove('wrong'),450)})}});
  };
  show()}

function BOOKS_(i){return ['Parallelo 5 NRW','Blue Line 1','Deutschbuch 5'][i]||'Klasse '+klasse()}

function packImport(j){
  const txt=JSON.stringify(j),r=parseAI(txt);
  if(!r.tasks.length&&!r.vocab.length&&!r.slides.length&&!r.dict.length)throw new Error('Das Paket enthält keine Aufgaben, Vokabeln, Folien oder Diktatsätze.');
  const sb=subIdx(j.subject),key=String(j.key||j.title||'Paket'),nm=String(j.title||(['Mathe','Englisch','Deutsch'][sb]+' '+new Date().toLocaleDateString('de-DE')));
  const book=String(j.book||BOOKS_(sb)),ex={slides:r.slides,dict:r.dict,kl:+j.klasse||klasse()};
  const old=MINE.find(x=>x.name===nm&&x.s===sb);
  if(old){old.text=key;old.vocab=mergePairs([],r.vocab);old.ai=r.tasks;old.d=Date.now();old.book=book;Object.assign(old,ex);saveMine();buildMine(old);return old}

/* ---------- Lexikon holen (Klexikon = einfach, Wikipedia = ausführlich) ---------- */
function wikiApi(src){return src==='klexikon'?'https://klexikon.zum.de/api.php':src==='simple'?'https://simple.wikipedia.org/w/api.php':'https://de.wikipedia.org/w/api.php'}
function wikiBase(src){return src==='klexikon'?'https://klexikon.zum.de/wiki/':src==='simple'?'https://simple.wikipedia.org/wiki/':'https://de.wikipedia.org/wiki/'}
async function wikiFetch(src,q,random){
  const api=wikiApi(src),u=random?`${api}?action=query&format=json&origin=*&generator=random&grnnamespace=0&grnlimit=1&prop=extracts&explaintext=1&exsectionformat=wiki&exchars=6000`
    :`${api}?action=query&format=json&origin=*&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=1&prop=extracts&explaintext=1&exsectionformat=wiki&exchars=12000`;
  const r=await fetch(u),j=await r.json(),p=Object.values((j.query&&j.query.pages)||{})[0];if(!p||!p.extract)return null;
  return{title:p.title,text:p.extract,url:wikiBase(src)+encodeURIComponent(p.title.replace(/ /g,'_')),src}}
function textToSlides(text,max){
  const out=[];let head='Überblick';
  text.split(/\n+/).forEach(par=>{par=par.trim();if(!par)return;const h=par.match(/^=+\s*(.*?)\s*=+$/);if(h){head=h[1];return}
    if(/^(Einzelnachweise|Literatur|Weblinks|Siehe auch|Anmerkungen|References|See also)$/i.test(head))return;
    const sents=par.match(/[^.!?]+[.!?]+(\s|$)/g)||[par];let cur='';
    sents.forEach(x=>{if((cur+x).length>420&&cur){out.push([head,cur.trim()]);cur=''}cur+=x});if(cur.trim())out.push([head,cur.trim()])});
  return out.slice(0,max||14)}
function sentencesOf(text){return(text.replace(/=+[^=\n]+=+/g,' ').replace(/\s+/g,' ').match(/[A-ZÄÖÜ][^.!?]{20,180}[.!?]/g)||[])}

    $('#sp').onclick=()=>{i--;draw()};$('#sn').onclick=()=>{i++;draw()};$('#sv').onclick=()=>speak(x[0]+'. '+x[1],'de-DE');
    let x0=null;const el=o.querySelector('.slide');el.ontouchstart=e=>x0=e.touches[0].clientX;el.ontouchend=e=>{if(x0==null)return;const dd=e.changedTouches[0].clientX-x0;x0=null;if(dd<-50&&i<sl.length-1){i++;draw()}if(dd>50&&i){i--;draw()}};
    $('#sx').onclick=()=>{const si=SUBJ.indexOf(s),it=packImport({subject:s.name,book:'Lexikon',title:d.title+' (Erklärung)',key:sl.map(z=>z[1]).join('\n').slice(0,6000),slides:sl.map(z=>({title:z[0],text:z[1],emoji:s.icon})),tasks:[],vocab:[]});go('#/t/m_'+it.id)};
    $('#so').onclick=()=>startCloze(d,s)};
  draw()}

/* ---------- Übungen aus dem Netz (Lückentexte, endlos) ---------- */
function clozeGen(text,lang){
  const sents=sentencesOf(text).filter(x=>x.split(' ').length>=6),stop=new Set('Der Die Das Ein Eine Diese Dieser Dieses Sie Er Es Wir Ihr Man Auch Dann Doch Aber Oder Und Wenn Weil Damit Heute Viele Einige Andere Jahre Jahr Zeit Teil Beispiel'.split(' '));
  const cand=s=>(s.match(lang==='en'?/\b[a-z]{6,}\b/g:/(?<=\s)[A-ZÄÖÜ][a-zäöüß]{4,}\b/g)||[]).filter(w=>!stop.has(w));
  const pool=[...new Set(sents.flatMap(cand))];if(sents.length<2||pool.length<4)return null;
  return()=>{for(let n=0;n<20;n++){const s=pick(sents),c=cand(s);if(!c.length)continue;const w=pick(c),o=shuffle(pool.filter(x=>x!==w)).slice(0,3);
    return Q('Welches Wort fehlt?<br><i>'+esc(s.replace(new RegExp('(^|[^A-Za-zÄÖÜäöüß])'+w+'(?![A-Za-zÄÖÜäöüß])'),'$1_____'))+'</i>',w,{kind:'choice',opts:shuffle([w,...o]),steps:esc(s)})}
    return Q('Welches Wort passt?',pool[0],{kind:'choice',opts:shuffle(pool.slice(0,4))})}}
function startCloze(d,s){
  const g=clozeGen(d.text,s.id==='englisch'?'en':'de');if(!g){alert('Der Text ist zu kurz für Übungen.');return}
  const id='on_'+Date.now().toString(36);TOPICS[id]={id,title:d.title,tags:'',sub:s,chap:{t:'Übungen aus dem Netz',i:'🌐'},s:textToSlides(d.text,8).map(x=>[esc(x[0]),esc(x[1])]),ex:[],extra:[],vgen:g};go('#/practice/'+id)}

function dictOffline(lang,k){
  if(lang==='en')return['My name is Tom and I live in London.','We have English on Monday and Tuesday.','There is a big tree in our garden.','My sister likes reading books.','Can you help me with my homework, please?','We went to the zoo last Saturday.','The weather is cold and windy today.','I usually get up at seven o\'clock.','Where are my trainers? They are under the bed.','He doesn\'t like vegetables, but he loves pizza.','Yesterday we played football in the park.','How much are the apples?','Would you like a cup of tea?','Our teacher is very friendly.','I am going to visit my grandparents next week.'];
  const a=['Im Sommer fahren wir mit dem Fahrrad an den See.','Der Hund bellt laut, weil er hungrig ist.','Meine Schwester liest gern spannende Bücher.','Am Wochenende besuchen wir unsere Großeltern.','Ich weiß, dass du morgen Geburtstag hast.','Das Wasser im Fluss fließt sehr schnell.','Wir müssen die Hausaufgaben bis Montag erledigen.','Der Lehrer erklärt die Aufgabe noch einmal.','Im Winter ist es draußen kalt und dunkel.','Nach dem Essen spielen die Kinder im Garten.','Die Straße ist nass, denn es hat geregnet.','Mein Bruder hat sich ein neues Spiel gewünscht.','Das Mädchen fährt mit dem Zug in die Stadt.','Am Abend ist der Himmel voller Sterne.','Wir haben viel Spaß beim Schwimmen gehabt.'];
  const b=['Obwohl es stark regnete, gingen wir spazieren.','Die Wissenschaftlerin erklärte, dass das Experiment gelungen sei.','Nachdem er den Brief gelesen hatte, rief er sofort an.','Das Ergebnis der Umfrage überraschte alle Beteiligten.','Wer rechtzeitig lernt, braucht sich vor der Prüfung nicht zu fürchten.','Die Mannschaft trainierte täglich, um das Endspiel zu gewinnen.','Im Allgemeinen ist das Wetter im Herbst wechselhaft.','Beim Lesen des Romans vergaß sie die Zeit.','Es ist wichtig, die Umwelt zu schützen und Müll zu vermeiden.','Die Abgeordneten diskutierten lange über das neue Gesetz.'];
  return k<=7?a:a.concat(b)}
function dictatPage(id){
  setNav('home');let lang='de',srcName='',sents=[],s=SUBJ[2];
  const t=id&&TOPICS[id],it=t&&t.mine&&MINE.find(x=>x.id===t.mine);
  if(it){s=SUBJ[it.s];lang=it.s===1?'en':'de';sents=(it.dict||[]).slice();if(!sents.length)sents=sentencesOf(it.text);srcName=it.name}
  else{if(id==='englisch'){s=SUBJ[1];lang='en'}srcName=s.name}
  const L=lang==='en'?'en-GB':'de-DE',k=klasse(),st={i:0,ok:0,n:0,q:shuffle(sents),chunk:0};
  const more=async()=>{try{const d=await wikiFetch(lang==='en'?'simple':k<=7?'klexikon':'wiki','',true);if(d){const add=sentencesOf(d.text).filter(x=>{const w=x.split(' ').length;return w>=5&&w<=(k<=7?12:18)&&!/[0-9()\[\]"„“:;]/.test(x)});st.q=st.q.concat(shuffle(add).slice(0,6))}}catch(e){}if(st.q.length<=st.i)st.q=st.q.concat(shuffle(dictOffline(lang,k)))};
  const draw=async()=>{if(st.i>=st.q.length){app().innerHTML='<p class="lead">Lade neue Sätze …</p>';await more()}
    const x=st.q[st.i],parts=[];const w=x.split(' ');for(let n=0;n<w.length;n+=3)parts.push(w.slice(n,n+3).join(' '));st.chunk=0;
    app().innerHTML=`<a class="back" href="${it?'#/t/'+id:'#/s/'+s.id}">← Ende</a><h1>✍️ Diktat – ${esc(srcName)}</h1><div class="vprog">Satz ${st.n+1} · ${st.ok} fehlerfrei</div>
    <div class="qcard"><div class="row2"><button id="dp" class="go">🔊 Ganzer Satz</button><button id="dc">🐢 Stück für Stück (${parts.length})</button></div>
    <textarea id="din" class="ans" rows="3" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Schreibe den Satz genau auf – mit Punkt und Großschreibung."></textarea><button id="dk" class="go">✔ Prüfen</button><div id="dfb"></div></div>
    <p class="hint">${it?'Sätze aus deiner Sache.':'Sätze aus dem '+(lang==='en'?'Simple-English-Wikipedia':k<=7?'Kinderlexikon':'Lexikon')+' oder aus der App – immer neue.'}</p>`;
    $('#dp').onclick=()=>speak(x,L);$('#dc').onclick=()=>{speak(parts[st.chunk%parts.length],L);st.chunk++};setTimeout(()=>speak(x,L),300);
    $('#dk').onclick=()=>{const a=$('#din').value.trim().replace(/\s+/g,' ');if(!a)return;const sol=x.split(' '),inp=a.split(' ');let err=0;
      const h=sol.map((wd,n)=>{const ok=inp[n]===wd;if(!ok)err++;return ok?esc(wd):`<b style="color:#dc2626;text-decoration:underline">${esc(wd)}</b>`}).join(' ');if(inp.length>sol.length)err+=inp.length-sol.length;
      st.n++;if(!err)st.ok++;$('#dfb').innerHTML=`<div class="fb ${err?'no':'ok'}"><b>${err?err+' Fehler':pick(PRAISE)+' Fehlerfrei!'}</b><br>${h}</div><button id="dnx" class="go">Nächster Satz ▶</button>`;$('#dk').disabled=true;$('#dnx').onclick=()=>{st.i++;draw()}};};
  draw()}

function genQ(id){const k=klasse(),f={mathe:gMathe,englisch:gEng,deutsch:gDeu,biologie:gBio,physik:gPhy,chemie:gChe,informatik:gInf,politik:gPol,geschichte:gGes,musik:gMus,erdkunde:gErd,franzoesisch:()=>gLang('franzoesisch'),spanisch:()=>gLang('spanisch'),latein:()=>gLang('latein')}[id]||gDeu;try{return f(k)}catch(e){return Q('Was ist 2 + 3?',5)}}

function chQ(q,a,others,ex){return Q(q,String(a),{kind:'choice',opts:shuffle([String(a)].concat(shuffle(others.map(String).filter(x=>x!==String(a))).slice(0,3))),steps:ex||''})}
function fromSet(set,k){const l=set.filter(x=>x[0]<=k);const e=pick(l.filter(x=>x[0]>=k-1).length&&R(0,2)?l.filter(x=>x[0]>=k-1):l);return chQ(e[1],e[2],e[3],e[4])}

  if(k<=6){if(t===0){const a=R(12,99),b=R(3,12);return Q(`Rechne: ${a} · ${b}`,a*b,{steps:`${a} · ${b} = ${a*b}`})}if(t===1){const b=R(3,12),q=R(11,99);return Q(`Rechne: ${b*q} : ${b}`,q,{steps:`${b} · ${q} = ${b*q}`})}const d=pick([2,4,5,10]),n=R(1,d-1),g=d*R(2,20);return Q(`Wie viel ist ${n}/${d} von ${g}?`,g/d*n,{steps:`${g} : ${d} = ${g/d}, · ${n} = ${g/d*n}`})}
  if(k<=8){if(t===0){const p=pick([5,10,15,20,25,30,40,50,75]),G=R(2,40)*20;return Q(`Wie viel sind ${p} % von ${G} €?`,G*p/100,{steps:`${G} · ${p} : 100 = ${G*p/100}`})}if(t===1){const x=R(-9,12),a=R(2,9),b=R(-20,20);return Q(`Löse nach x auf: ${a}x ${b<0?'−':'+'} ${Math.abs(b)} = ${a*x+b}`,x,{steps:`${a}x = ${a*x+b} ${b<0?'+':'−'} ${Math.abs(b)} = ${a*x} → x = ${x}`})}const a=R(2,9),p=R(2,8)*a,c=R(2,12);return Q(`${a} Hefte kosten ${p} €. Wie viel kosten ${c} Hefte?`,p/a*c,{steps:`1 Heft: ${p} : ${a} = ${p/a} €; ${c} Hefte: ${p/a*c} €`})}

  if(t===0){const a=R(1,5),n=R(2,4),b=R(-6,6),x0=R(-3,3);return Q(`f(x) = ${a}x<sup>${n}</sup> ${b<0?'−':'+'} ${Math.abs(b)}x. Berechne f′(${x0}).`,a*n*x0**(n-1)+b,{steps:`f′(x) = ${a*n}x<sup>${n-1}</sup> ${b<0?'−':'+'} ${Math.abs(b)} → f′(${x0}) = ${a*n*x0**(n-1)+b}`})}
  if(t===1){const n=pick([1,2,3]),bb=pick(n===2?[3,6]:n===3?[2,4]:[2,4,6]),a=n===2?pick([1,2,3]):n===3?pick([1,2]):pick([1,2,3]);const v=a*bb**(n+1)/(n+1);return Q(`Berechne ∫ von 0 bis ${bb} von ${a===1?'':a}x${n>1?'<sup>'+n+'</sup>':''} dx`,v,{steps:`Stammfunktion ${a}/${n+1}·x<sup>${n+1}</sup>; ${a}/${n+1}·${bb}<sup>${n+1}</sup> = ${v}`})}

/* Silbentrennung (Regeln für deutsche Wörter, automatisch – kann bei einzelnen Wörtern abweichen) */
function lsSyl(w){
  const low=w.toLowerCase(),M=['sch','ch','ck','ph','qu','th','ie','ei','ai','au','eu','äu','aa','ee','oo'],u=[];
  for(let i=0;i<w.length;){const m=M.find(x=>low.startsWith(x,i)),n=m?m.length:1;u.push(w.substr(i,n));i+=n}
  const isV=x=>/^[aeiouäöüy]/i.test(x)&&x.toLowerCase()!=='qu',vi=u.map((x,i)=>isV(x)?i:-1).filter(i=>i>=0);
  if(vi.length<2)return[w];
  const cut=[];for(let k=0;k<vi.length-1;k++){const a=vi[k],b=vi[k+1],c=b-a-1;if(c===0)cut.push(b);else if(c===1)cut.push(a+1);else{const two=(u[b-2]+u[b-1]).toLowerCase();cut.push(c>=3&&/^(bl|br|pl|pr|kl|kr|gl|gr|fl|fr|dr|tr|schl|schm|schn|schw|schr|zw|kn|sp)$/.test(two)?b-2:b-1)}}
  const out=[];let s=0;cut.forEach(c=>{out.push(u.slice(s,c).join(''));s=c});out.push(u.slice(s).join(''));return out.filter(Boolean)}
function lsWordHtml(word,arc){const p=lsSyl(word);return `<span class="lsw" data-w="${esc(word)}">`+p.map((x,i)=>`<span class="ls${i%2?2:1}${arc?' lsa':''}">${esc(x)}</span>`).join('')+'</span>'}

function bildSvg(inner,h){return `<svg class="bild" viewBox="0 0 320 ${h||200}" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">${inner}</svg>`}

function bildFor(text,used){used=used||new Set();const L=bildLib();for(const b of L){if(used.has(b[1]))continue;if(b[0].test(text)){used.add(b[1]);return `<figure style="margin:10px 0">${b[2]()}<figcaption class="hint" style="text-align:center">🖼️ ${b[1]}</figcaption></figure>`}}return''}
/* Bilder aus Wikipedia (Wikimedia, online) */
function bilderTerm(t){return String(t.title).replace(/<[^>]+>/g,'').replace(/^.*?[–-]\s*/,'').replace(/\(.*?\)/g,'').replace(/[:,].*$/,'').trim()||t.title}
async function bilderPage(t,q){
  setNav('home');q=q||bilderTerm(t);
  app().innerHTML=`<a class="back" href="#/t/${t.id}">← ${esc(t.title)}</a><h1>🖼️ Bilder zum Thema</h1><p class="hint">Bilder aus Wikipedia (Wikimedia). Antippen öffnet den Artikel mit Bildnachweis. Braucht Internet.</p>
  <div class="row2"><input id="bq" class="ans" value="${esc(q)}"><button class="go" id="bgo">Suchen</button></div><div id="bout" class="netimg"><p class="hint">Lade …</p></div>`;
  $('#bgo').onclick=()=>bilderPage(t,$('#bq').value.trim());
  try{const u='https://de.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrlimit=12&prop=pageimages|info&piprop=thumbnail&pithumbsize=400&inprop=url';
    const j=await (await fetch(u)).json(),P=Object.values((j.query&&j.query.pages)||{}).filter(p=>p.thumbnail).sort((a,b)=>a.index-b.index);
    if(!$('#bout'))return;$('#bout').innerHTML=P.length?P.map(p=>`<a href="${esc(p.fullurl)}" target="_blank" rel="noopener"><figure><img loading="lazy" alt="${esc(p.title)}" src="${esc(p.thumbnail.source)}"><figcaption>${esc(p.title)}</figcaption></figure></a>`).join(''):'<p class="hint">Keine Bilder gefunden. Anderes Suchwort probieren.</p>'}
  catch(e){if($('#bout'))$('#bout').innerHTML='<p class="hint">Keine Verbindung zum Internet.</p>'}}

/* ===== Taschenrechner (wissenschaftlich) + Rechenweg (Funktionsdeklarationen) ===== */
function tcState(){if(!window.__tc){let s={};try{s=JSON.parse(localStorage.getItem('sh5tc')||'{}')}catch(e){}window.__tc=Object.assign({ex:'',deg:true,mem:0,ans:0,hist:[],sci:true},s)}return window.__tc}
function tcSave(){const s=tcState();try{localStorage.setItem('sh5tc',JSON.stringify({deg:s.deg,mem:s.mem,ans:s.ans,hist:s.hist.slice(0,30),sci:s.sci}))}catch(e){}}
function tcFact(n){if(n<0||n%1)throw new Error('Fakultät nur für natürliche Zahlen');if(n>170)return Infinity;let r=1;for(let i=2;i<=n;i++)r*=i;return r}
/* Sicherer Rechner ohne eval: Zahlen, + − × ÷ ^, %, !, Klammern, Funktionen, π, e, Ans */
function tcEval(src,deg){
  const s=String(src).replace(/\s+/g,'').replace(/·|\*/g,'×').replace(/:|\//g,'÷').replace(/-/g,'−').replace(/,/g,'.');let i=0;
  const F={sin:x=>Math.sin(deg?x*Math.PI/180:x),cos:x=>Math.cos(deg?x*Math.PI/180:x),tan:x=>{const v=Math.tan(deg?x*Math.PI/180:x);if(deg&&Math.abs((x%180+180)%180-90)<1e-9)throw new Error('tan ist hier nicht definiert');return v},
    asin:x=>{const v=Math.asin(x);return deg?v*180/Math.PI:v},acos:x=>{const v=Math.acos(x);return deg?v*180/Math.PI:v},atan:x=>{const v=Math.atan(x);return deg?v*180/Math.PI:v},
    '√':x=>{if(x<0)throw new Error('Keine Wurzel aus negativen Zahlen');return Math.sqrt(x)},'∛':Math.cbrt,ln:x=>{if(x<=0)throw new Error('ln nur für Zahlen > 0');return Math.log(x)},log:x=>{if(x<=0)throw new Error('log nur für Zahlen > 0');return Math.log10(x)},abs:Math.abs};
  const peek=()=>s[i],eat=c=>{if(s.startsWith(c,i)){i+=c.length;return true}return false};
  function primary(){
    if(eat('(')){const v=expr();if(!eat(')'))throw new Error('Klammer fehlt');return v.v}
    for(const f of Object.keys(F).sort((a,b)=>b.length-a.length))if(s.startsWith(f,i)){i+=f.length;let v;if(eat('(')){v=expr().v;if(!eat(')'))throw new Error('Klammer fehlt')}else v=unary().v;return F[f](v)}
    if(eat('π'))return Math.PI;if(eat('Ans'))return tcState().ans;if(s[i]==='e'&&!/[a-z]/.test(s[i+1]||'')){i++;return Math.E}
    const m=s.slice(i).match(/^\d*\.?\d+(E[+−]?\d+)?|^\d+\./);if(m){i+=m[0].length;return parseFloat(m[0].replace('−','-'))}
    throw new Error(i>=s.length?'Rechnung unvollständig':'Unbekanntes Zeichen: '+s[i])}
  function postfix(){let v=primary(),pct=false;for(;;){if(eat('!'))v=tcFact(v);else if(eat('²'))v=v*v;else if(eat('%')){v=v/100;pct=true}else break}

      const nv=nd.querySelector('nav[epub\\:type="toc"],nav#toc,nav')||nd;nv.querySelectorAll('a[href]').forEach(a=>{const pp=epubPath(nb,a.getAttribute('href'));if(pp!=null&&idx[pp]!==undefined)toc.push({t:(a.textContent||'').replace(/\s+/g,' ').trim()||'Kapitel',c:idx[pp],d:a.closest('li')&&a.closest('li').parentElement.closest('li')?1:0})})}
    else if(ncx){const np=epubPath(dir,ncx.href),nd=dp.parseFromString(await z.text(np),'text/xml'),nb=np.indexOf('/')>=0?np.slice(0,np.lastIndexOf('/')):'';
